<!DOCTYPE html>
<html lang="tr">
<head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2024831118719429"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NİŞANGAH — Oyun Haberleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151a;
    --surface: #1b1d24;
    --surface-2: #23252f;
    --text: #f2f1ed;
    --muted: #8b8fa3;
    --lime: #d4ff3f;
    --coral: #ff5c4d;
    --border: #2a2d38;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.01em;
    line-height:1.05;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  /* ---- Ticker ---- */
  .ticker{
    background:var(--lime);
    color:#101114;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    padding:7px 0;
  }
  .ticker-track{display:inline-block;padding-left:100%;animation:scroll 28s linear infinite;}
  .ticker-track span{margin-right:48px;}
  @keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-100%);}}
  @media (prefers-reduced-motion: reduce){.ticker-track{animation:none;padding-left:0;}}

  /* ---- Header ---- */
  header{
    border-bottom:1px solid var(--border);
    position:sticky;top:0;background:rgba(20,21,26,0.92);backdrop-filter:blur(6px);
    z-index:50;
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0;}
  .logo{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;
    letter-spacing:0.02em;
    clip-path:polygon(0 0, 100% 0, 96% 100%, 0% 100%);
    background:var(--lime);color:#101114;padding:6px 16px 6px 12px;
  }
  .logo b{color:var(--coral);}
  .navlinks{display:flex;gap:28px;font-family:'Oswald',sans-serif;font-weight:500;font-size:14px;}
  .navlinks a{color:var(--muted);transition:color .15s;padding:4px 0;border-bottom:2px solid transparent;}
  .navlinks a:hover, .navlinks a:focus-visible{color:var(--text);border-color:var(--coral);}
  .navlinks a:focus-visible{outline:none;}
  .navtoggle{display:none;background:none;border:1px solid var(--border);color:var(--text);padding:8px 12px;font-family:'Oswald',sans-serif;}
  @media (max-width:760px){
    .navlinks{display:none;}
    .navtoggle{display:block;}
  }

  /* ---- Hero ---- */
  .hero{padding:44px 0 36px;}
  .hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;}
  @media (max-width:820px){.hero-grid{grid-template-columns:1fr;}}
  .hero-main{
    position:relative;
    background:linear-gradient(135deg,#2a2140,#1b1d24 60%);
    clip-path:polygon(0 0, 100% 0, 100% 92%, 92% 100%, 0 100%);
    padding:40px 36px 32px;
    min-height:360px;
    display:flex;flex-direction:column;justify-content:flex-end;
    border:1px solid var(--border);
    overflow:hidden;
  }
  .hero-main::before{
    content:"";position:absolute;top:-40%;right:-20%;width:70%;height:140%;
    background:radial-gradient(circle, rgba(212,255,63,0.18), transparent 65%);
  }
  .hero-main img.bg{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0.35;z-index:0;
  }
  .hero-main > *{position:relative;z-index:1;}
  .tag{
    display:inline-block;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;
    background:var(--coral);color:#101114;padding:4px 10px;
    clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);
    margin-bottom:14px;width:fit-content;
  }
  .hero-main h1{font-size:clamp(28px,4vw,44px);max-width:14ch;position:relative;}
  .hero-main p{color:var(--muted);margin-top:14px;max-width:46ch;font-size:15px;position:relative;}
  .hero-side{display:flex;flex-direction:column;gap:16px;}
  .side-card{
    background:var(--surface);border:1px solid var(--border);padding:18px;
    display:flex;flex-direction:column;gap:8px;flex:1;
    position:relative;overflow:hidden;
  }
  .side-card img.bg{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0.25;z-index:0;
  }
  .side-card > *{position:relative;z-index:1;}
  .side-card .tag{background:var(--surface-2);color:var(--lime);}
  .side-card h3{font-size:17px;}
  .side-card p{color:var(--muted);font-size:13px;}

  /* ---- Section heading ---- */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:52px 0 20px;border-bottom:1px solid var(--border);padding-bottom:10px;}
  .section-head h2{font-size:22px;}
  .section-head .count{color:var(--muted);font-size:13px;font-family:'Inter',sans-serif;}

  /* ---- Article grid ---- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.grid{grid-template-columns:1fr;}}
  .card{
    background:var(--surface);border:1px solid var(--border);
    display:flex;flex-direction:column;
    transition:border-color .15s;
  }
  .card:hover{border-color:var(--lime);}
  .card-media{
    height:140px;position:relative;overflow:hidden;
    background:linear-gradient(145deg,var(--surface-2),#14151a);
  }
  .card-media img{width:100%;height:100%;object-fit:cover;}
  .card-media::after{
    content:attr(data-cat);
    position:absolute;bottom:0;left:0;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;
    background:var(--lime);color:#101114;padding:3px 10px;
    clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);
  }
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-body h3{font-size:16px;line-height:1.25;}
  .card-body .src{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;}
  .card-body p{color:var(--muted);font-size:13px;}

  footer{border-top:1px solid var(--border);margin-top:60px;padding:32px 0;color:var(--muted);font-size:13px;}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
</style>
</head>
<body>

<div class="ticker">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<header>
  <div class="wrap nav">
    <a href="#" class="logo">NİŞAN<b>GAH</b></a>
    <nav class="navlinks">
      <a href="#">Anasayfa</a>
      <a href="#">PC</a>
      <a href="#">Konsol</a>
      <a href="#">Mobil</a>
      <a href="#">İncelemeler</a>
      <a href="#">Fırsatlar</a>
    </nav>
    <button class="navtoggle">Menü</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-grid" id="heroGrid"></div>
  </section>

  <section class="section-head">
    <h2>Son Haberler</h2>
    <span class="count" id="articleCount"></span>
  </section>
  <div class="grid" id="newsGrid"></div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 Nişangah — Oyun Haberleri</span>
    <span>Haberler otomatik olarak kaynaklardan derlenmektedir.</span>
  </div>
</footer>

<script>
// Örnek/başlangıç verisi — articles.json bulunamazsa bu kullanılır.
const SAMPLE_ARTICLES = [
  {title:"Yeni nesil açık dünya oyunu tanıtıldı", category:"PC", source:"OyunHaber", url:"#", summary:"Geliştirici stüdyo, uzun süredir beklenen projesinin ilk fragmanını yayınladı.", image:null},
  {title:"Popüler battle royale oyununa dev güncelleme geldi", category:"Konsol", source:"GameWire", url:"#", summary:"Yeni harita, silahlar ve dengeleme değişiklikleri oyuncularla buluştu.", image:null},
  {title:"Mobil oyun pazarında yükselen trend: kısa oturum tasarımı", category:"Mobil", source:"MobilOyun", url:"#", summary:"Geliştiriciler artık daha kısa ve tekrar oynanabilir seviyelere yöneliyor.", image:null},
  {title:"İnceleme: Yılın en çok konuşulan yapımı beklentileri karşılıyor mu?", category:"İnceleme", source:"Nişangah", url:"#", summary:"Hikaye, oynanış ve teknik performans açısından detaylı değerlendirme.", image:null},
  {title:"E-spor turnuvasında sürpriz sonuç", category:"E-spor", source:"ESporTR", url:"#", summary:"Alt sıradaki takım finale kalarak favorileri elemeyi başardı.", image:null},
  {title:"Donanım fiyatlarında yeni sezon indirimleri başladı", category:"Fırsat", source:"TeknoOyun", url:"#", summary:"Ekran kartı ve konsol fiyatlarında dikkat çekici düşüşler gözlemleniyor.", image:null}
];

async function loadArticles(){
  try{
    const res = await fetch('articles.json', {cache:"no-store"});
    if(!res.ok) throw new Error('no file');
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data && data.articles) || [];
    return list.length ? list : SAMPLE_ARTICLES;
  }catch(e){
    return SAMPLE_ARTICLES;
  }
}

function renderHero(articles){
  const [feat, a, b] = articles;
  const heroGrid = document.getElementById('heroGrid');
  heroGrid.innerHTML = `
    <a class="hero-main" href="${feat.url}">
      ${feat.image ? `<img class="bg" src="${feat.image}" alt="">` : ''}
      <span class="tag">${feat.category}</span>
      <h1>${feat.title}</h1>
      <p>${feat.summary}</p>
    </a>
    <div class="hero-side">
      <a class="side-card" href="${a ? a.url : '#'}">
        ${a && a.image ? `<img class="bg" src="${a.image}" alt="">` : ''}
        <span class="tag">${a ? a.category : ''}</span>
        <h3>${a ? a.title : ''}</h3>
        <p>${a ? a.summary : ''}</p>
      </a>
      <a class="side-card" href="${b ? b.url : '#'}">
        ${b && b.image ? `<img class="bg" src="${b.image}" alt="">` : ''}
        <span class="tag">${b ? b.category : ''}</span>
        <h3>${b ? b.title : ''}</h3>
        <p>${b ? b.summary : ''}</p>
      </a>
    </div>`;
}

function renderGrid(articles){
  const grid = document.getElementById('newsGrid');
  document.getElementById('articleCount').textContent = articles.length + ' haber';
  grid.innerHTML = articles.map(a => `
    <a class="card" href="${a.url}">
      <div class="card-media" data-cat="${a.category}">${a.image ? `<img src="${a.image}" alt="" loading="lazy">` : ''}</div>
      <div class="card-body">
        <h3>${a.title}</h3>
        <p>${a.summary}</p>
        <span class="src"><span>${a.source}</span></span>
      </div>
    </a>`).join('');
}

function renderTicker(articles){
  const track = document.getElementById('tickerTrack');
  track.innerHTML = articles.map(a => `<span>▸ ${a.title}</span>`).join('');
}

loadArticles().then(articles=>{
  renderTicker(articles);
  renderHero(articles.slice(0,3));
  renderGrid(articles.slice(3).length ? articles.slice(3) : articles);
});
</script>
</body>
</html>
