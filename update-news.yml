name: Haberleri Güncelle

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı çalışır (UTC saatine göre)
  workflow_dispatch:        # GitHub'dan elle "Run workflow" ile de tetiklenebilir

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install feedparser

      - name: Haberleri çek
        run: python fetch_news.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || git commit -m "Haberler güncellendi"
          git push
