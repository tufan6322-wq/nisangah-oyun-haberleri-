backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "haberler"
    label: "Haberler"
    files:
      - name: "articles"
        label: "Haberler Listesi"
        file: "articles.json"
        fields:
          - label: "Haberler"
            name: "articles"
            widget: "list"
            label_singular: "Haber"
            summary: "{{title}}"
            fields:
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Kategori", name: "category", widget: "string" }
              - { label: "Kaynak", name: "source", widget: "string" }
              - { label: "Link", name: "url", widget: "string" }
              - { label: "Özet", name: "summary", widget: "text" }
              - { label: "Yayın Tarihi", name: "published", widget: "datetime", required: false }
